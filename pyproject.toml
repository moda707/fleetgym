[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fleetgym"
version = "0.1.0.dev0"
description = "Gymnasium and PettingZoo environments for reinforcement learning on stochastic and dynamic vehicle routing problems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mohsen Dastpak" }]
keywords = [
    "reinforcement learning",
    "vehicle routing",
    "operations research",
    "gymnasium",
    "pettingzoo",
    "stochastic optimization",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "vrplib>=1.5",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.4", "sb3-contrib>=2.4", "torch>=2.4"]
gnn = ["torch-geometric>=2.6"]
solvers = ["pyvrp>=0.14,<0.15"]
viz = ["matplotlib>=3.8"]
all = ["fleetgym[sb3,gnn,solvers,viz]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
]

[project.scripts]
fleetgym = "fleetgym.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetgym"]

[tool.hatch.build.targets.sdist]
include = ["src/fleetgym", "tests", "docs", "README.md", "LICENSE", "CITATION.cff", "CHANGELOG.md"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff formats Python code blocks inside Markdown; docs (DESIGN.md is a verbatim copy) are hand-written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "PT",            # pytest style
    "NPY",           # numpy-specific
    "RUF",           # ruff-specific
    "D",             # docstrings (numpy convention)
    "TID",           # tidy imports
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # __init__ is documented in the class docstring (numpy style)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow and not network"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: long-running suites (gate tests, training sanity checks)",
    "network: tests that download data; never run in default CI",
    "extras_sb3: requires the [sb3] extra",
    "extras_solvers: requires the [solvers] extra",
    "extras_viz: requires the [viz] extra",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["fleetgym"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]
