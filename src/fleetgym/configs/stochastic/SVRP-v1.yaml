# yaml-language-server: $schema=../fleetgym.schema.json
# VRP with stochastic demands. Each customer's demand is revealed when the vehicle arrives; the
# instance gives its distribution (`distributions.demand`). A vehicle that cannot fit a demand
# serves what fits, restocks at the depot and comes back (detour-to-depot recourse).
id: SVRP-v1
extends: CVRP-v1
meta:
  name: VRP with stochastic demands
  status: experimental
  references: [bertsimas1992, gendreau1996]
uncertainty:
  demand: {revealed: on_arrival}
recourse:
  capacity_failure: {serve: what_fits, remainder: come_back}
