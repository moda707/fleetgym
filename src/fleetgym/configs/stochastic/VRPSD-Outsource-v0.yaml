# yaml-language-server: $schema=../fleetgym.schema.json
# Planned for Gate 2 (M11): model, parameters and instances come from the VRP-SDO paper.
id: VRPSD-Outsource-v0
extends: CVRP-v0
meta:
  name: Stochastic demands with outsourcing
  status: planned
  references: [vrpsdo_under_review]
fleet:
  sizing: fixed
  types: [{name: truck, capacity: from_instance, count: from_instance}]
uncertainty:
  demand: {dist: poisson, mean: from_instance, revealed: on_arrival}
constraints:
  outsourcing: {cost: per_customer, value: from_instance}
# Provisional until Gate 2: the policy chooses between restocking and outsourcing.
recourse:
  capacity_failure: {rule: agent_decides, per_customer: {from_instance: outsourcing_costs}}
decisions: {epochs: on_event, interface: next_node}
objective: {distance: 1.0, outsourcing: 1.0}
