# yaml-language-server: $schema=../fleetgym.schema.json
id: VRPSD-v0
extends: CVRP-v0
meta:
  name: VRP with stochastic demands
  status: experimental
  references: [bertsimas1992, gendreau1996]
# Demand is Poisson around the instance's demand and becomes known when the vehicle arrives.
# A failure (demand above the free capacity) is handled by the classical detour to the depot.
uncertainty:
  demand: {dist: poisson, mean: from_instance, revealed: on_arrival}
recourse:
  capacity_failure: {rule: return_to_depot, partial_service: true, on_exact_depletion: continue}
