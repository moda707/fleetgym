# yaml-language-server: $schema=../fleetgym.schema.json
id: VRPTW-v0
extends: CVRP-v0
meta:
  name: VRP with time windows
  status: stable
  references: [solomon1987]
  instances: {source: solomon, set: "100"}
# Default source for quick experiments; benchmark runs pass Solomon instances explicitly.
instance_source:
  type: generator
  name: uniform
  params:
    n_customers: 20
    size: 100
    capacity: 100
    demand: {low: 1, high: 20}
    time_windows: {horizon: 480, width_low: 60, width_high: 180, service_time: 10}
network: {type: euclidean, rounding: none}
constraints:
  time_windows: {soft: false, waiting: allowed}
  route_duration: {max: depot_due_time}
objective: {lexicographic: [vehicles, distance]}
