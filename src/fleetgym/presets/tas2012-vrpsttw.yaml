# Taş, Dellaert, van Woensel and de Kok, VRP with stochastic travel times, soft time windows and
# service costs (Section 3; experiments in Section 5). Solomon's 56 instances (100 customers) with
# capacity 200; the travel time per unit distance is Gamma(alpha, lambda) with mean 1, so the
# expected travel time of an arc is its Euclidean distance; service starts on arrival (no waiting),
# early and late service are penalized; overtime is charged beyond a shift of 480. Instances: the
# example 16_vrptw_tas writes them (one set per instance and coefficient of variation).
preset: tas2012-vrpsttw
name: VRP with stochastic travel times and soft time windows
reference:
  key: tas2012stochastic
  title: Vehicle Routing Problem with Stochastic Travel Times Including Soft Time Windows and Service Costs
  authors: Duygu Taş, Nico Dellaert, Tom van Woensel and Ton de Kok
  version: Beta working paper 364, Eindhoven, March 2012
  sections: ["3", "3.2", "5"]
spec:
  extends: VRPTW-v1
  network: {type: euclidean, rounding: none}
  constraints:
    capacity: {}
    time_windows: {mode: soft, early: serve}
    route_duration: {mode: soft}  # max_route_duration = 480 from the instance; overtime beyond it
  uncertainty:
    travel_time: {revealed: on_arrival}  # gamma_per_distance from the instance
  objective: {lexicographic: null, lateness: 1.0, earliness: 0.1, distance: 1.0, vehicles: 400.0, overtime: 0.8333333333333334}
grid:
  instance:
    - c101
    - c102
    - c103
    - c104
    - c105
    - c106
    - c107
    - c108
    - c109
    - c201
    - c202
    - c203
    - c204
    - c205
    - c206
    - c207
    - c208
    - r101
    - r102
    - r103
    - r104
    - r105
    - r106
    - r107
    - r108
    - r109
    - r110
    - r111
    - r112
    - r201
    - r202
    - r203
    - r204
    - r205
    - r206
    - r207
    - r208
    - r209
    - r210
    - r211
    - rc101
    - rc102
    - rc103
    - rc104
    - rc105
    - rc106
    - rc107
    - rc108
    - rc201
    - rc202
    - rc203
    - rc204
    - rc205
    - rc206
    - rc207
    - rc208
  cv: ["0.25", "1", "4"]
default: {instance: r101, cv: "1"}
instances: {folder: "{instance}-cv{cv}"}
notes:
  - Objective weights are the paper's costs (c_d, c_e, c_t, c_f, c_o) = (1, 0.1, 1, 400, 5/6). The paper's weighting rho divides the service and transport costs by C1 and C2, computed from its own initial solution, so it belongs to the method; the raw costs equal rho = 0.5 with C1 = C2.
  - The depot's window is not penalized (soft windows charge customers only); overtime is charged against w = 480.
  - One travel time is drawn per arc and episode (each arc is driven at most once by the paper's routes). Vehicles leave the depot at time 0; the paper's departure-time shift (Section 4.3) is part of its method.
