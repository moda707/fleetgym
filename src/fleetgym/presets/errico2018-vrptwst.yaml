# Errico, Desaulniers, Gendreau, Rei and Rousseau, VRP with hard time windows and stochastic
# service times (Sections 3 and 5.1). Solomon instances without demands or capacity: the first 25
# customers of all 56 instances and the first 50 customers of the type-1 instances (85); service
# times are discrete triangular on a 0.1 grid; the depot has no time window; the objective is the
# distance, under a chance constraint on the success probability of the plan. Instances: the
# example 17_vrptw_errico writes them (one set per family and instance).
preset: errico2018-vrptwst
name: VRP with hard time windows and stochastic service times
reference:
  key: errico2018vrptwst
  title: The vehicle routing problem with hard time windows and stochastic service times
  venue: EURO Journal on Transportation and Logistics 7, 223-251 (2018)
  doi: 10.1007/s13676-016-0101-4
  sections: ["3", "5.1"]
spec:
  extends: VRPTW-v1
  network: {type: euclidean, rounding: none}
  fleet: {sizing: limited}  # up to the instance's vehicle count, which never binds
  constraints:
    capacity: null
    route_duration: null
    time_windows: {mode: hard, waiting: allowed, depot: ignore}
  uncertainty:
    service_time: {revealed: on_completion}  # discrete_triangular from the instance
  decisions: {interface: next_node, epochs: on_event}
  objective: {lexicographic: null, distance: 1.0, unserved: 1000.0}
grid:
  family: [basic, low_probability, large_support, positive_skewed]
  instance:
    - c101-25
    - c102-25
    - c103-25
    - c104-25
    - c105-25
    - c106-25
    - c107-25
    - c108-25
    - c109-25
