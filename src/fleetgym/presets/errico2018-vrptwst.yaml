instances: {folder: "{family}-{instance}"}
notes:
  - "Reliability thresholds of the paper: alpha = 0.95 (basic, large_support, positive_skewed) and 0.85 (low_probability). The chance constraint is not part of the simulation: report the success rate (episodes without an unserved customer) next to the cost."
  - A customer that can no longer be reached in its window is skipped and ends unserved (charged 1000, a modeling choice); for a priori routes a route fails exactly when one of its customers is skipped (the paper's eq. 10).
  - "Positive-skewed: the paper gives medians 7.0 (R, RC) and 63.0 (C), which no triangular distribution on those supports has; they are used as modes."
  - "Discretization: each 0.1 grid point gets the probability of its cell under the continuous triangular density (the paper does not say how it discretizes). Travel times are Solomon distances without rounding."
