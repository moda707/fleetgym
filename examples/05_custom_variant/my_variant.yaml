# A new VRP variant: rural parcel collection. The model says what exists; the instances (schema
# rural-parcels.schema.yaml, written by instances.py) carry every number. Demands are uncertain
# (a custom distribution), a van makes at most `max_stops` stops per route (a custom constraint), and
# a van that cannot fit a parcel restocks if the depot is near, else a courier takes the rest (a
# custom recourse rule). The building blocks are in plugins.py.
id: MyVariant-v1
extends: SVRP-v1
meta:
  name: Rural parcel collection with a stop limit
  status: experimental
instance_source: {type: files, paths: [instances/rural]}
network: {type: euclidean, rounding: none}
fleet: {sizing: fixed}
decisions: {interface: next_node, epochs: on_event}
uncertainty:
  demand: {revealed: on_arrival}
constraints:
  capacity: {}
  max_stops: {max: {from_instance: max_stops}}
recourse:
  capacity_failure:
    rule: near_depot_restock
    radius: {from_instance: restock_radius}
    per_unit: {from_instance: courier_price}
objective: {distance: 1.0, outsourcing: 1.0, unserved: 200.0}
