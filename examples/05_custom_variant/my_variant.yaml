# A new VRP variant: rural parcel collection. Customers cluster around villages (a custom generator),
# demands are uncertain (a custom distribution), a van makes at most 5 stops per route (a custom
# constraint), and a van that cannot fit a parcel restocks if the depot is near, else hands the
# rest to a courier (a custom recourse rule). The building blocks are in plugins.py.
id: MyVariant-v0
extends: VRPSD-v0
meta:
  name: Rural parcel collection with a stop limit
  status: experimental
instance_source:
  type: generator
  name: villages
  params: {n_customers: 24, n_villages: 4, spread: 6.0}
network: {type: euclidean, rounding: none}
fleet:
  sizing: fixed
  types: [{name: van, capacity: 15, count: 6}]
decisions: {interface: next_node, epochs: on_event}
uncertainty:
  demand: {dist: triangular_demand, low: 0, mode: from_instance, high: 12, revealed: on_arrival}
constraints:
  capacity: {}
  max_stops: {max: 5}
recourse:
  capacity_failure: {rule: near_depot_restock, radius: 40, per_unit: 3.0}
objective: {distance: 1.0, outsourcing: 1.0, unserved: 200.0}
