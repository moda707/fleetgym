name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: slow suites and latest dependency releases
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra sb3 --extra solvers --extra viz --extra docs  # type-check optional modules
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - name: Tests
        run: uv run pytest -n auto --cov --cov-config=.github/coverage-core.toml --cov-report=term --hypothesis-profile=ci --junitxml=junit.xml
      - name: Annotate failed tests
        if: failure()
        run: uv run python .github/scripts/junit_annotations.py junit.xml

  extras:
    name: Tests with optional extras (sb3, solvers, viz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra sb3 --extra solvers --extra viz
      - name: Tests
        run: uv run pytest -n auto -m "(extras_sb3 or extras_solvers or extras_viz) and not slow" --junitxml=junit.xml
      - name: Annotate failed tests
        if: failure()
        run: uv run python .github/scripts/junit_annotations.py junit.xml

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra docs --extra viz
      - run: uv run sphinx-build -W --keep-going -b html docs/site docs/_build/html

  slow:
    name: Slow suites (gates)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -n auto -m slow --hypothesis-profile=ci
