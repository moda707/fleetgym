# Publishes to PyPI with trusted publishing (no API token) when a GitHub release is published.
# One-time setup on PyPI: add a (pending) trusted publisher with owner `moda707`, repository
# `fleetgym`, workflow `release.yml`, environment `pypi`. See CONTRIBUTING.md, "Releasing".
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/fleetgym list
          /tmp/smoke/bin/python -c "import fleetgym as fg; env = fg.make('CVRP-v0'); env.reset(seed=0)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fleetgym/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
